# Configurações do Spring Boot para o InfraTrace

spring.application.name=infratrace

# Porta HTTP da API (http://localhost:8080)
server.port=8080

# Anexos
# Pasta onde os arquivos ficam. ${VARIAVEL:padrao} = usa a variável de ambiente se existir,
# senão o valor depois dos dois-pontos ("anexos", relativo à pasta onde a aplicação foi iniciada).
infratrace.anexos.diretorio=${INFRATRACE_ANEXOS_DIR:anexos}
# Tamanho máximo de cada arquivo e de cada requisição de envio
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Faz o Tomcat ler o corpo inteiro de envios grandes demais, para a API conseguir responder 413
# (sem isso, a conexão é cortada e o Postman mostra só "connection reset")
server.tomcat.max-swallow-size=-1

# Banco de dados
# O usuário, a senha e a URL NÃO ficam aqui: a classe br.com.infratrace.config.Conexao lê
# direto das variáveis de ambiente INFRATRACE_DB_URL, INFRATRACE_DB_USER e
# INFRATRACE_DB_PASSWORD. Não usamos spring.datasource.* porque o acesso ao banco é feito
# manualmente com JDBC (DriverManager), e não por um DataSource do Spring.
