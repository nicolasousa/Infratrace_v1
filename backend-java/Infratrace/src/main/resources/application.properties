# Configurações do Spring Boot para o InfraTrace

spring.application.name=infratrace

# Porta HTTP da API (http://localhost:8080)
server.port=8080

# Banco de dados
# O usuário, a senha e a URL NÃO ficam aqui: a classe br.com.infratrace.config.Conexao lê
# direto das variáveis de ambiente INFRATRACE_DB_URL, INFRATRACE_DB_USER e
# INFRATRACE_DB_PASSWORD. Não usamos spring.datasource.* porque o acesso ao banco é feito
# manualmente com JDBC (DriverManager), e não por um DataSource do Spring.
